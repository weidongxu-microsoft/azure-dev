# yaml-language-server: $schema=../extension.schema.json
id: azure.springboot
namespace: spring
displayName: Azure Spring Boot
description: Detects Spring Boot applications and initializes them for Azure Container Apps.
usage: azd spring init [--yes]
version: 0.1.0
requiredAzdVersion: ">=1.23.0"
language: go
capabilities:
  - custom-commands
examples:
  - name: init
    description: Generate azd project files from an existing Maven Spring Boot application.
    usage: azd spring init

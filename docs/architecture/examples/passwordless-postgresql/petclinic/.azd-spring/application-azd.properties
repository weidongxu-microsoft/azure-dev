spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:5432/petclinic?sslmode=verify-full&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin&azure.managedIdentityEnabled=true
spring.datasource.username=petclinic_app
spring.datasource.password=
spring.datasource.hikari.data-source-properties.sslrootcert=/etc/ssl/certs/ca-certificates.crt
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
